    </header>

    <main class="jogo">

        <section class="mesa">


            <div class="titulo">
                <h2>Mesa</h2>

            </div>

            <div class="cartas" id="cartas_mesa">


            </div>


            </div>

        <section class="botoes">

                </div>

                    <p>Parar</p>
                </div>
                <div class="botao" id="button_restart">
                    <p>Salvar</p>
                </div>
            </div>
